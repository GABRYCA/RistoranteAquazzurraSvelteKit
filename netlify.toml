# Netlify build settings for a fully-static SvelteKit site (adapter-static)
# built with Bun 1.4.
[build]
command = "bun install --frozen-lockfile && bun --bun run build"
publish = "build"

[build.environment]
BUN_VERSION = "1.4.2"
NODE_VERSION = "22.12.0"

[functions]
node_bundler = "esbuild"

# Hashed SvelteKit assets are content-addressed and safe to cache immutably.
[[headers]]
for = "/_app/immutable/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

# Security headers for every response (HTML is revalidated by Netlify's CDN by default).
[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "camera=(), microphone=(), geolocation=()"
